

<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI बैकग्राउंड दोस्त ✨</title>
    <style>
        /* सुंदर और आधुनिक डिजाइन (CSS) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* मुख्य बैकग्राउंड जो बदलेगा */
        #bg-wallpaper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            background-size: cover;
            background-position: center;
            transition: background-image 0.8s ease-in-out;
            z-index: 1;
        }

        /* धुंधला ग्लास इफ़ेक्ट स्क्रीन के ऊपर */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.2);
            z-index: 2;
        }

        /* चैट बॉक्स का स्टाइल */
        .chat-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            z-index: 3;
            color: white;
            text-align: center;
        }

        h2 {
            font-size: 20px;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        /* एआई के बात करने का डिब्बा */
        .ai-response {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            min-height: 60px;
            max-height: 150px;
            overflow-y: auto;
            font-size: 15px;
            line-height: 1.5;
            text-align: left;
            border-left: 4px solid #00f2fe;
        }

        /* इनपुट बॉक्स एरिया */
        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 25px;
            outline: none;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }

        button {
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.6);
        }

        /* लोडिंग एनीमेशन */
        .loader {
            display: none;
            color: #00f2fe;
            font-style: italic;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- बैकग्राउंड इमेज वॉलपेपर -->
    <div id="bg-wallpaper"></div>
    <div class="overlay"></div>

    <!-- चैट करने वाला इंटरफ़ेस -->
    <div class="chat-container">
        <h2>आपका एआई दोस्त 🤖</h2>
        
        <!-- यहाँ AI प्यार से बात करेगा -->
        <div class="ai-response" id="ai-text">
            नमस्ते दोस्त! आपको कहाँ घूमना है या कैसा बैकग्राउंड चाहिए? मुझे बताइए, मैं बातें भी करूँगा और बैकग्राउंड भी बदल दूँगा! ❤️
        </div>
        
        <div class="loader" id="loading-msg">आपका एआई दोस्त सोच रहा है... 🚀</div>

        <!-- इनपुट बॉक्स -->
        <div class="input-group">
            <input type="text" id="user-input" placeholder="जैसे: मनाली के पहाड़ दिखाओ और कुछ बात करो...">
            <button onclick="askAI()">पूछें ✨</button>
        </div>
    </div>

    <!-- जादू वाला जावास्क्रिप्ट कोड (JavaScript) -->
    <script>
        // इनपुट फील्ड पर Enter दबाने से भी काम करेगा
        document.getElementById("user-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                askAI();
            }
        });

        async function askAI() {
            const inputField = document.getElementById("user-input");
            const aiTextField = document.getElementById("ai-text");
            const loader = document.getElementById("loading-msg");
            const bgWallpaper = document.getElementById("bg-wallpaper");
            
            const userText = inputField.value.trim();
            if (!userText) return;

            // स्क्रीन साफ और लोडिंग शुरू
            inputField.value = "";
            loader.style.display = "block";
            aiTextField.innerHTML = "सोच रहा हूँ...";

            try {
                // 1. यह मुफ्त API यूजर की बात के हिसाब से खूबसूरत इमेज ढूंढेगा
                const imageKeywords = encodeURIComponent(userText);
                const imageUrl = `https://unsplash.com`; // बैकअप इमेज
                
                // अनस्प्लैश की रैंडम इमेज API सर्च कीवर्ड के आधार पर
                const finalImageUrl = `https://unsplash.com{imageKeywords}`;
                
                // बैकग्राउंड तुरंत बदलें
                bgWallpaper.style.backgroundImage = `url('${finalImageUrl}')`;

                // 2. बातों के लिए प्यारा सा एआई जवाब तैयार करना (बिना किसी महँगी की (Key) के काम करने वाला ट्रिक)
                // यहाँ हम एक दोस्ताना जवाब हिंदी में खुद से बना रहे हैं क्योंकि डायरेक्ट बिना चाबी के AI चैट नहीं देता
                let aiReply = "";
                
                if(userText.includes("मनाली") || userText.includes("पहाड़") || userText.includes("mountain")) {
                    aiReply = "वाह! पहाड़ों की ठंडी हवा किसे पसंद नहीं? देखिए, मैंने आपके लिए पीछे मनाली के खूबसूरत पहाड़ों का बैकग्राउंड लगा दिया है। चलो साथ में चाय पीते हैं! 🏔️☕";
                } else if(userText.includes("ताजमहल") || userText.includes("taj mahal")) {
                    aiReply = "प्यार की निशानी ताजमहल! आपकी पसंद वाकई बहुत लावाब है दोस्त। देखिए पीछे दीदार कीजिए ताजमहल का! 🕌✨";
                } else if(userText.includes("गोवा") || userText.includes("समुद्र") || userText.includes("beach")) {
                    aiReply = "चलो गोवा चलते हैं! समंदर की लहरें और ठंडी हवा... मजा ही आ गया। आपका बैकग्राउंड बदल दिया है, एन्जॉय कीजिए! 🏖️🌊";
                } else if(userText.includes("कपड़े") || userText.includes("fashion") || userText.includes("clothes")) {
                    aiReply = "अरे वाह! आपको फैशन का शौक है? यह देखिए एकदम स्टाइलिश और नया लुक आपके बैकग्राउंड में। आप पर हर रंग जचेगा! 👕✨";
                } else if(userText.includes("हेलो") || userText.includes("hi") || userText.includes("hello")) {
                    aiReply = "हेलो मेरे प्यारे दोस्त! मैं बिल्कुल ठीक हूँ। आप कैसे हैं? आज आपको कहाँ की सैर कराऊँ, जल्दी से नाम बताइए! 😊❤️";
                } else {
                    aiReply = `अरे वाह! आपने बहुत बढ़िया चीज़ पूछी। मैंने आपके लिए पीछे "${userText}" से जुड़ा एक बहुत ही शानदार बैकग्राउंड लगा दिया है। आपको यह कैसा लगा, मुझे जरूर बताना! 🥰✨`;
                }

                // एआई का जवाब स्क्रीन पर दिखाना
                aiTextField.innerHTML = aiReply;

            } catch (error) {
                aiTextField.innerHTML = "माफ़ करना दोस्त, कुछ गड़बड़ हो गई। एक बार फिर से कोशिश करो ना! 🥺";
            } finally {
                loader.style.display = "none";
            }
        }
    </script>
</body>
</html>
