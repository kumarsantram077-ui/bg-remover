<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मस्त गूगल सर्च और फोटो अपलोडर एआई 🤖🔥</title>
    <style>
        /* आधुनिक और प्रीमियम लुक */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f19;
        }

        /* मुख्य बैकग्राउंड जहाँ लाइव फोटो दिखेगी */
        #bg-wallpaper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #111827, #0b0f19);
            background-size: cover;
            background-position: center;
            transition: background-image 0.5s ease-in-out;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 2;
        }

        /* चैट और कंट्रोल बॉक्स */
        .chat-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 550px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 22px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            z-index: 3;
            color: white;
            text-align: center;
        }

        h2 {
            font-size: 20px;
            margin-bottom: 12px;
            color: #38bdf8;
        }

        /* बातचीत और जोक बॉक्स */
        .ai-response {
            background: rgba(15, 23, 42, 0.8);
            padding: 15px;
            border-radius: 16px;
            margin-bottom: 15px;
            font-size: 15px;
            line-height: 1.5;
            text-align: left;
            border-left: 5px solid #ec4899;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
        }

        /* इनपुट बॉक्स एरिया */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 30px;
            outline: none;
            font-size: 15px;
            background: #fff;
            color: #0f172a;
        }

        button {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        /* फोटो अपलोड करने का स्टाइल */
        .upload-section {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 15px;
            border: 1px dashed rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .upload-section label {
            background: #06b6d4;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: 0.3s;
        }

        .upload-section label:hover {
            background: #0891b2;
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <!-- बैकग्राउंड इमेज परत -->
    <div id="bg-wallpaper"></div>
    <div class="overlay"></div>

    <!-- चैट इंटरफेस -->
    <div class="chat-container">
        <h2>गूगल सर्च और फोटो अपलोडर दोस्त 🤖🖼️</h2>
        
        <div class="ai-response" id="ai-text">
            अरे भाई! अब आपकी वेबसाइट सीधे इंटरनेट से लाइव तस्वीरें खोजेगी। नीचे किसी भी जगह या चीज का नाम लिखो, या फिर अपनी खुद की फोटो अपलोड करके जादू देखो! 😜🔥
        </div>

        <!-- गूगल/लाइव सर्च इनपुट -->
        <div class="input-group">
            <input type="text" id="user-input" placeholder="जैसे: मनाली, गोवा बीच, लग्जरी कार...">
            <button onclick="searchLiveImage()">खोजें 🚀</button>
        </div>

        <!-- फाइल अपलोड सेक्शन -->
        <div class="upload-section">
            <span>या अपनी फोटो लगाएं:</span>
            <label for="image-uploader">📁 फोटो चुनें</label>
            <input type="file" id="image-uploader" accept="image/*" onchange="uploadLocalImage(event)">
        </div>
    </div>

    <script>
        // मजेदार चुटकुलों की लिस्ट
        const jokes = [
            "लो भाई! इंटरनेट के कोने-कोने से ढूंढकर आपके लिए कड़क फोटो लगा दी है। पसंद आए तो समोसा कूरियर कर देना! 🥐😂",
            "वाह हुजूर! क्या चॉइस है आपकी। पीछे का बैकग्राउंड देखकर जलने वाले और जलेंगे! 🔥😜",
            "लीजिए मालिक! फोटो लाइव लोड हो चुकी है। अब स्क्रीन को ज्यादा मत निहारना, वरना नजर लग जाएगी! 🧿🤭",
            "अरे गजब! ये बैकग्राउंड तो एकदम झकास लग रहा है। चलो इसी बात पर एक कप कड़क चाय हो जाए! ☕️✨",
            "लो दोस्त, मैंने फोटो बदल दी है। अब जल्दी से बताओ, इस नए बैकग्राउंड में आप घूमने कब जा रहे हो? 😎🎒"
        ];

        // 1. लाइव इमेज सर्च फंक्शन (Google/Unsplash लाइव नेटवर्क आधारित)
        function searchLiveImage() {
            const inputField = document.getElementById("user-input");
            const aiTextField = document.getElementById("ai-text");
            const bgWallpaper = document.getElementById("bg-wallpaper");
            
            const userText = inputField.value.trim();
            if (!userText) return;

            aiTextField.innerHTML = "इंटरनेट पर ढूंढ रहा हूँ, कृपया रुकें... 🌐";
            inputField.value = "";

            // यह लाइव यूआरएल बिना ब्लॉक हुए कीवर्ड के आधार पर सीधे इंटरनेट से फ्रेश इमेज लोड करता है
            const finalImageUrl = `https://unsplash.com`; // बैकअप
            const liveQueryUrl = `https://unsplash.com{encodeURIComponent(userText)}&sig=${Math.floor(Math.random() * 1000)}`;

            const img = new Image();
            img.src = liveQueryUrl;

            img.onload = function() {
                bgWallpaper.style.backgroundImage = `url('${liveQueryUrl}')`;
                const randomJoke = jokes[Math.floor(Math.random() * jokes.length)];
                aiTextField.innerHTML = `<strong>आपने खोजा:</strong> "${userText}"<br><br><strong>🤖 एआई दोस्त:</strong> ${randomJoke}`;
            };

            img.onerror = function() {
                aiTextField.innerHTML = "अरे यार! इंटरनेट धीमा है या इस नाम की फोटो नहीं मिली। कुछ और लिखकर देखो! 🥺";
            };
        }

        // 2. लोकल फोटो अपलोड फंक्शन
        function uploadLocalImage(event) {
            const aiTextField = document.getElementById("ai-text");
            const bgWallpaper = document.getElementById("bg-wallpaper");
            const file = event.target.files[0];

            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    // अपलोड की हुई फाइल को बैकग्राउंड में सेट करना
                    bgWallpaper.style.backgroundImage = `url('${e.target.result}')`;
                    aiTextField.innerHTML = "<strong>🤖 एआई दोस्त:</strong> अरे वाह भाई! ये तो आपकी अपनी पसंदीदा फोटो है। बैकग्राउंड में सेट कर दी है, एकदम बवाल लग रही है! 🥰📸";
                };
                reader.readAsDataURL(file);
            }
        }

        // Enter दबाने पर भी सर्च होगा
        document.getElementById("user-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                searchLiveImage();
            }
        });
    </script>
</body>
</html>
