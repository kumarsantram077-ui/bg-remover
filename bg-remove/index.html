
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>एआई फोटो मेकर दोस्त ✨</title>
    <style>
        /* आधुनिक और सुंदर डिज़ाइन */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
        }

        /* मुख्य बैकग्राउंड जहाँ एआई फोटो दिखेगी */
        #bg-wallpaper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            background-size: cover;
            background-position: center;
            transition: background-image 1s ease-in-out;
            z-index: 1;
        }

        /* हल्का डार्क पर्दा ताकि टेक्स्ट साफ़ दिखे */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 2;
        }

        /* चैट और कंट्रोल बॉक्स */
        .chat-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 550px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            z-index: 3;
            color: white;
            text-align: center;
        }

        h2 {
            font-size: 22px;
            margin-bottom: 12px;
            color: #60a5fa;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* एआई के बात करने का बॉक्स */
        .ai-response {
            background: rgba(15, 23, 42, 0.6);
            padding: 15px;
            border-radius: 16px;
            margin-bottom: 15px;
            font-size: 16px;
            line-height: 1.5;
            text-align: left;
            border-left: 4px solid #3b82f6;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        /* लोडिंग टेक्स्ट */
        .loader {
            display: none;
            color: #38bdf8;
            font-style: italic;
            font-weight: bold;
            margin-bottom: 12px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        /* इनपुट बॉक्स ग्रुप */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 30px;
            outline: none;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.95);
            color: #1e293b;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* बटन स्टाइल */
        .btn-make {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        .btn-make:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
        }

        .btn-download {
            background: linear-gradient(135deg, #10b981, #047857);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            display: none;
            margin: 0 auto;
            transition: 0.3s;
        }

        .btn-download:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- बैकग्राउंड वॉलपेपर -->
    <div id="bg-wallpaper"></div>
    <div class="overlay"></div>

    <!-- मुख्य चैट इंटरफ़ेस -->
    <div class="chat-container">
        <h2>जादुई एआई फोटो दोस्त 🤖🎨</h2>
        
        <!-- यहाँ एआई बात करेगा -->
        <div class="ai-response" id="ai-text">
            नमस्ते दोस्त! आप जो भी सोच रहे हैं, यहाँ लिख दीजिए। मैं आपसे बातें भी करूँगा और तुरंत आपके लिए एक बिल्कुल नई असली फोटो बनाकर बैकग्राउंड में लगा दूँगा! ❤️
        </div>
        
        <div class="loader" id="loading-msg">⏳ आपकी सोच को फोटो में बदला जा रहा है, कृपया 5 सेकंड रुकें...</div>

        <!-- फोटो बनाने के लिए इनपुट -->
        <div class="input-group">
            <input type="text" id="user-input" placeholder="जैसे: मनाली के पहाड़ों में बर्फबारी, या लाल रंग की कार...">
            <button class="btn-make" onclick="generateImage()">फोटो बनाओ 🚀</button>
        </div>

        <!-- एचडी डाउनलोड बटन -->
        <button class="btn-download" id="download-btn" onclick="downloadPhoto()">📥 इस फोटो को HD में डाउनलोड करें</button>
    </div>

    <script>
        let currentImageUrl = "";

        // Enter दबाने पर भी फोटो बनेगी
        document.getElementById("user-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                generateImage();
            }
        });

        async function generateImage() {
            const inputField = document.getElementById("user-input");
            const aiTextField = document.getElementById("ai-text");
            const loader = document.getElementById("loading-msg");
            const bgWallpaper = document.getElementById("bg-wallpaper");
            const downloadBtn = document.getElementById("download-btn");
            
            const userText = inputField.value.trim();
            if (!userText) return;

            // रीसेट और लोडिंग चालू
            inputField.value = "";
            loader.style.display = "block";
            downloadBtn.style.display = "none";
            aiTextField.innerHTML = "सोच रहा हूँ और ब्रश तैयार कर रहा हूँ...";

            try {
                // पोलिनेशन एआई का मुफ्त रियल-टाइम इमेज जनरेटर यूज़ कर रहे हैं
                // यह यूजर के लिखे शब्दों (Prompt) से लाइव फोटो बनाता है
                const cleanText = encodeURIComponent(userText);
                const randomSeed = Math.floor(Math.random() * 100000); // हर बार नई फोटो के लिए
                const aiGeneratedUrl = `https://pollinations.ai{cleanText}?width=1600&height=900&seed=${randomSeed}&enhance=true`;

                // इमेज को बैकग्राउंड में लोड करना
                const img = new Image();
                img.src = aiGeneratedUrl;
                
                img.onload = function() {
                    bgWallpaper.style.backgroundImage = `url('${aiGeneratedUrl}')`;
                    currentImageUrl = aiGeneratedUrl;
                    
                    // प्यारी बातें करने वाला एआई दिमाग (हिंदी रिप्लाई)
                    let aiReply = "";
                    if(userText.includes("मनाली") || userText.includes("पहाड़") || userText.includes("snow")) {
                        aiReply = "वाह भाई! बर्फ से ढके पहाड़ और ठंडी वादियां देखकर मेरा भी मन खुश हो गया। देखिए, मैंने आपके लिए ये खूबसूरत जादुई नजारा बना दिया है! कैसा लगा? 🏔️❄️";
                    } else if(userText.includes("कार") || userText.includes("गाड़ी") || userText.includes("car")) {
                        aiReply = "क्या बात है, सुपर कार! आपकी चॉइस एकदम कड़क है दोस्त। ये चमचमाती हुई गाड़ी सीधे आपके बैकग्राउंड में आ चुकी है, लॉन्ग ड्राइव पर चलें? 🏎️💨";
                    } else if(userText.includes("ताजमहल") || userText.includes("taj")) {
                        aiReply = "अरे वाह, हुजूर! दुनिया का अजूबा ताजमहल आपके सामने हाजिर है। एआई ने इसे बेहद खूबसूरती से तराशा है। दीदार कीजिए! 🕌✨";
                    } else {
                        aiReply = `मजा आ गया दोस्त! आपने कहा और मैंने अपनी जादुई शक्तियों से **"${userText}"** की बिल्कुल नई फोटो तैयार कर दी। बैकग्राउंड देखिए, एकदम लाजवाब लग रहा है ना? 🥰🎨`;
                    }

                    aiTextField.innerHTML = aiReply;
                    loader.style.display = "none";
                    downloadBtn.style.display = "block"; // डाउनलोड बटन दिखाएं
                };

                img.onerror = function() {
                    throw new Error("फोटों लोड नहीं हो पाई");
                };

            } catch (error) {
                aiTextField.innerHTML = "माफ़ करना भाई, इंटरनेट या सर्वर में कुछ दिक्कत आ गई। एक बार फिर लिख कर कोशिश करो! 🥺";
                loader.style.display = "none";
            }
        }

        // फोटो डाउनलोड करने का फंक्शन
        function downloadPhoto() {
            if(currentImageUrl) {
                const a = document.createElement('a');
                a.href = currentImageUrl;
                a.download = 'AI_Background.jpg';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
        }
    </script>
</body>
</html>
